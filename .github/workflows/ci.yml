name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]

    - name: Run pytest
      run: |
        pytest

  verified-mutation-score:
    name: Tier 2 Verified Mutation Score (mutmut)
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies and mutmut
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
        pip install mutmut>=3.7.0

    - name: Run Authoritative mutmut Check on Session Diff
      run: |
        echo "=== Running Tier 2 Authoritative Mutation Testing ==="
        # Run mutmut on source package
        mutmut run || true
        mutmut export-cicd-stats || true
        if [ -f mutants/mutmut-cicd-stats.json ]; then
          cat mutants/mutmut-cicd-stats.json
        fi
