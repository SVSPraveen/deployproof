[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deployproof"
version = "1.1.18"
description = "DeployProof (Python CLI) — AI-code verification, in-memory AST mutation testing, secrets scanning & self-healing test synthesis for Python by SVS Praveen."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "SVS Praveen", email = "svspraveens@gmail.com" }
]
keywords = [
    "mutation-testing",
    "pre-push-gate",
    "self-healing-tests",
    "ast-mutation-testing",
    "ai-code-verification",
    "python-cli",
    "code-quality",
    "developer-tools",
    "pytest-plugin",
    "sast-scanner",
    "credential-scanner",
    "supply-chain-security",
    "slopsquatting",
    "ai-code-defense",
    "python-testing",
    "devops-quality-gate",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pytest>=7.0.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.0.0",
    "twine>=4.0.0",
    "coverage>=7.0.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/SVSPraveen/deployproof"
Documentation = "https://svspraveen.github.io/deployproof/"
Portfolio = "https://svspraveen.vercel.app/"
Repository = "https://github.com/SVSPraveen/deployproof.git"
"Bug Tracker" = "https://github.com/SVSPraveen/deployproof/issues"

[project.scripts]
deployproof = "deployproof.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
