[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deployproof"
version = "1.1.11"
description = "Deterministic pre-push quality & security verification gate for Python codebases that catches what coverage misses."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "SVS Praveen", email = "svspraveens@gmail.com" }
]
keywords = [
    "code-quality",
    "mutation-testing",
    "security-scanner",
    "developer-tools",
    "pre-push-verification",
    "python-testing",
    "ast-analysis",
    "dependency-security",
    "ai-code",
    "slopsquatting",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "build>=1.0.0",
    "twine>=4.0.0",
    "coverage>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/SVSPraveen/DeployProof"
Documentation = "https://github.com/SVSPraveen/DeployProof#readme"
Repository = "https://github.com/SVSPraveen/DeployProof.git"
"Bug Tracker" = "https://github.com/SVSPraveen/DeployProof/issues"

[project.scripts]
deployproof = "deployproof.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
